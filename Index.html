	<style>
		@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

		body{
			margin: 0;
			padding: 0;
			background-color: black;
			color: white;
			font-family: 'Poppins', 'Sans-serif';
		}

		h1{
			margin: 20px;
		}

		h4{
			margin: 20px 20px 2px 20px;
		}

		.GridBox{
			padding: 5px;
		/*	height: 300px; */
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
			/* grid-template-rows: auto;  */
			/* Add some grid box container property to test first */
			/*background-color: pink;*/
			justify-items: center;
			align-items: center;
		  gap: 5px;

			
		}

		.i1{
		/*	width: 30px;
			height: 30px; */
			background-color: hwb(41 0% 7%);
		}

		.GridBox img{
			width: 100%;
			aspect-ratio: 1 / 1;
			height: 100%;
			object-fit: cover;
			border: 1px solid hwb(0 40% 60% / 0.5058823529411764);
			border-radius: 3px;
		}

		.lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
      padding: 20px;
		}

		.lightbox.active {
      opacity: 1;
      pointer-events: auto;
		}

		.lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		}

		.lightbox.active img {
      transform: scale(1);
		}

		.lightbox-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #fff;
      font-size: 35px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }

    .lightbox-close:hover {
      color: #ff5252;
		}
	
	</style>
</head>

	<div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img src="" alt="Fullscreen preview" id="lightboxImg">
	</div>

	<script>

		const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    document.querySelectorAll('.GridBox img').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeGallery() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      lightboxImg.src = '';
    }

    lightboxClose.addEventListener('click', closeGallery);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeGallery();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        closeGallery();
      }
    });		

	</script>
